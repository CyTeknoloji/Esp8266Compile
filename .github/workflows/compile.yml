name: ESP8266 Bulut Derleyici

on:
  workflow_dispatch:
    inputs:
      sketch_code:
        description: 'Arduino/ESP8266 Kodu'
        required: true
      libraries:
        description: 'Kütüphaneler (Virgülle ayırın)'
        required: false
        default: ''
      library_files:
        description: 'Uygulamadan zip kütüphaneler (JSON)'
        required: false
      board_type:
        description: 'Kart Modeli (FQBN)'
        required: true
        default: 'esp8266:esp8266:nodemcuv2'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arduino CLI Kur
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: ESP8266 Çekirdek Kurulumu
        run: |
          ./bin/arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          ./bin/arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Kütüphaneleri Kur (Gelişmiş Strateji)
        run: |
          LIBS="${{ github.event.inputs.libraries }}"
          if [ ! -z "$LIBS" ]; then
            echo "$LIBS" | tr ',' '\n' | while read lib; do
              trim_lib=$(echo "$lib" | xargs)
              if [ ! -z "$trim_lib" ]; then
                echo "--- İşleniyor: $trim_lib ---"

                if [[ "$trim_lib" == "DHT" ]]; then
                  ./bin/arduino-cli lib install "DHT sensor library"
                  ./bin/arduino-cli lib install "Adafruit Unified Sensor"
                  continue
                fi

                if ./bin/arduino-cli lib install "$trim_lib"; then
                  echo "$trim_lib kuruldu."
                else
                  SEARCH_NAME=$(./bin/arduino-cli lib search "$trim_lib" --format text | grep "Name:" | head -n 1 | cut -d' ' -f2- | tr -d '"' | xargs)
                  if [ ! -z "$SEARCH_NAME" ]; then
                    ./bin/arduino-cli lib install "$SEARCH_NAME"
                  fi
                fi
              fi
            done
          fi

      - name: Uygulamadan gelen kütüphane zip dosyaları
        env:
          LIBRARY_FILES: ${{ github.event.inputs.library_files }}
        run: |
          python3 <<'PY'
          import os, json, base64, zipfile
          from io import BytesIO
          raw = os.environ.get("LIBRARY_FILES", "")
          if not raw.strip():
              print("library_files bos, atlaniyor")
          else:
              libs = os.path.expanduser("~/Arduino/libraries")
              os.makedirs(libs, exist_ok=True)
              for item in json.loads(raw):
                  name = (item.get("name") or "CustomLib").strip()
                  data = base64.b64decode(item.get("zip") or "")
                  root = os.path.join(libs, name)
                  os.makedirs(root, exist_ok=True)
                  with zipfile.ZipFile(BytesIO(data)) as zf:
                      zf.extractall(root)
                  print("Installed", name)
          PY

      - name: Sketch Hazırla (Python Güvenli Yazım)
        shell: python
        env:
          SKETCH_INPUT: ${{ github.event.inputs.sketch_code }}
        run: |
          import os
          content = os.environ.get('SKETCH_INPUT', '')
          os.makedirs('MySketch', exist_ok=True)
          with open('MySketch/MySketch.ino', 'w', encoding='utf-8') as f:
              f.write(content)

      - name: Derle
        run: |
          mkdir -p output
          ./bin/arduino-cli compile --fqbn ${{ github.event.inputs.board_type }} MySketch --output-dir ./output

      - name: Binary Dosyasını Paketle (Artifact)
        run: |
          zip -j esp8266-firmware.zip output/*.bin

      - name: Artifact Olarak Yayınla
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-firmware
          path: esp8266-firmware.zip
