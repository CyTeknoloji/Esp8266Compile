name: ESP8266 Build Compiler

on:
  workflow_dispatch: # Manuel tetikleme için
    inputs:
      sketch_code:
        description: 'Arduino Kodunu Buraya Yapıştırın'
        required: true
        default: 'void setup() { pinMode(2, OUTPUT); } void loop() { digitalWrite(2, HIGH); delay(500); digitalWrite(2, LOW); delay(500); }'
      board:
        description: 'Kart Tipi'
        required: true
        default: 'esp8266:esp8266:nodemcuv2' # Yaygın kullanılan kart

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Install ESP8266 Core
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Create Sketch File
        run: |
          mkdir -p MyProject
          echo "${{ github.event.inputs.sketch_code }}" > MyProject/MyProject.ino

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn ${{ github.event.inputs.board }} MyProject --output-dir ./build

      - name: Upload Binary as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: esp8266-firmware
          path: ./build/*.bin
