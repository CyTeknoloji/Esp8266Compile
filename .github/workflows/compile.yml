name: ESP8266 Bulut Derleyici

on:
  workflow_dispatch:
    inputs:
      sketch_code:
        description: 'Arduino/ESP8266 Kodu'
        required: true
      libraries:
        description: 'Kütüphaneler (Virgülle ayırın)'
        required: false
        default: ''
      library_files:
        description: 'Uygulamadan zip kütüphaneler (JSON)'
        required: false
      board_type:
        description: 'Kart Modeli (FQBN)'
        required: true
        default: 'esp8266:esp8266:nodemcuv2'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arduino CLI Kur
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: ESP8266 Çekirdek Kurulumu
        run: |
          ./bin/arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          ./bin/arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Kütüphaneleri Kur (Gelişmiş Strateji)
        run: |
          LIBS="${{ github.event.inputs.libraries }}"
          echo "Uygulamadan gelen kutuphane listesi: [${LIBS:-bos}]"
          if [ ! -z "$LIBS" ]; then
            echo "$LIBS" | tr ',' '\n' | while read lib; do
              trim_lib=$(echo "$lib" | xargs)
              if [ ! -z "$trim_lib" ]; then
                echo "--- İşleniyor: $trim_lib ---"

                trim_lower=$(echo "$trim_lib" | tr '[:upper:]' '[:lower:]')
                case "$trim_lower" in
                  *dht*) ./bin/arduino-cli lib install "DHT sensor library" || true; ./bin/arduino-cli lib install "Adafruit Unified Sensor" || true; continue ;;
                  *adafruit_gfx*|*gfx*) ./bin/arduino-cli lib install "Adafruit GFX Library" || true; ./bin/arduino-cli lib install "Adafruit BusIO" || true; continue ;;
                  *adafruit_ssd*) ./bin/arduino-cli lib install "Adafruit SSD1306" || true; ./bin/arduino-cli lib install "Adafruit BusIO" || true; continue ;;
                  *servo*|*varspeed*) ./bin/arduino-cli lib install "Servo" || true; continue ;;
                  *mfrc*) ./bin/arduino-cli lib install "MFRC522" || true; continue ;;
                  *liquidcrystal*) ./bin/arduino-cli lib install "LiquidCrystal I2C" || true; continue ;;
                  *arduinojson*) ./bin/arduino-cli lib install "ArduinoJson" || true; continue ;;
                  *pubsub*) ./bin/arduino-cli lib install "PubSubClient" || true; continue ;;
                  *tinygps*) ./bin/arduino-cli lib install "TinyGPSPlus" || true; continue ;;
                  *softwareserial*) ./bin/arduino-cli lib install "EspSoftwareSerial" || true; continue ;;
                  *espasync*) ./bin/arduino-cli lib install "ESP Async WebServer" || true; ./bin/arduino-cli lib install "ESPAsyncTCP" || true; continue ;;
                  *audio*|*esp8266audio*) ./bin/arduino-cli lib install "ESP8266Audio" || true; continue ;;
                esac

                if ./bin/arduino-cli lib install "$trim_lib"; then
                  echo "$trim_lib kuruldu."
                else
                  SEARCH_NAME=$(./bin/arduino-cli lib search "$trim_lib" --format text | grep "Name:" | head -n 1 | cut -d' ' -f2- | tr -d '"' | xargs)
                  if [ ! -z "$SEARCH_NAME" ]; then
                    ./bin/arduino-cli lib install "$SEARCH_NAME"
                  fi
                fi
              fi
            done
          fi

      - name: Uygulamadan gelen kütüphane zip dosyaları
        env:
          LIBRARY_FILES: ${{ github.event.inputs.library_files }}
        run: |
          python3 scripts/install_library_files.py

      - name: Sketch Hazırla (Python Güvenli Yazım)
        shell: python
        env:
          SKETCH_INPUT: ${{ github.event.inputs.sketch_code }}
        run: |
          import os
          content = os.environ.get('SKETCH_INPUT', '')
          os.makedirs('MySketch', exist_ok=True)
          with open('MySketch/MySketch.ino', 'w', encoding='utf-8') as f:
              f.write(content)

      - name: Derle
        run: |
          mkdir -p output
          ./bin/arduino-cli compile --fqbn ${{ github.event.inputs.board_type }} MySketch --output-dir ./output

      - name: Binary Dosyasını Paketle (Artifact)
        run: |
          zip -j esp8266-firmware.zip output/*.bin

      - name: Artifact Olarak Yayınla
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-firmware
          path: esp8266-firmware.zip
